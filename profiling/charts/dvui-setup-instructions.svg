<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="900" height="612" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="600" fill="#1f2328">dvui one-time setup: 131.4M instructions</text>
<text x="20" y="44" font-size="11" fill="#57606a">paid once per process, then amortized &#183; callgrind over the headless demo bench, freetype 2.14.1, ReleaseFast</text>
<text x="420" y="98" font-size="12" fill="#1f2328" text-anchor="end">freetype: hinting interpreter</text>
<rect x="430" y="78" width="300.0" height="30" fill="#cf222e" rx="2"/>
<text x="738.0" y="98" font-size="12" font-weight="600" fill="#1f2328">80.48M  61%</text>
<text x="420" y="142" font-size="12" fill="#1f2328" text-anchor="end">freetype: autohinter</text>
<rect x="430" y="122" width="44.7" height="30" fill="#cf222e" rx="2"/>
<text x="482.7" y="142" font-size="12" font-weight="600" fill="#1f2328">12.00M  9%</text>
<text x="420" y="186" font-size="12" fill="#1f2328" text-anchor="end">freetype: outline load</text>
<rect x="430" y="166" width="41.6" height="30" fill="#cf222e" rx="2"/>
<text x="479.6" y="186" font-size="12" font-weight="600" fill="#1f2328">11.15M  8%</text>
<text x="420" y="230" font-size="12" fill="#1f2328" text-anchor="end">freetype: other</text>
<rect x="430" y="210" width="40.5" height="30" fill="#cf222e" rx="2"/>
<text x="478.5" y="230" font-size="12" font-weight="600" fill="#1f2328">10.86M  8%</text>
<text x="420" y="274" font-size="12" fill="#1f2328" text-anchor="end">freetype: rasterizer</text>
<rect x="430" y="254" width="37.7" height="30" fill="#cf222e" rx="2"/>
<text x="475.7" y="274" font-size="12" font-weight="600" fill="#1f2328">10.12M  8%</text>
<text x="420" y="318" font-size="12" fill="#1f2328" text-anchor="end">freetype: charmap lookup</text>
<rect x="430" y="298" width="8.8" height="30" fill="#cf222e" rx="2"/>
<text x="446.8" y="318" font-size="12" font-weight="600" fill="#1f2328">2.35M  2%</text>
<text x="420" y="362" font-size="12" fill="#1f2328" text-anchor="end">allocator</text>
<rect x="430" y="342" width="6.4" height="30" fill="#8c959f" rx="2"/>
<text x="444.4" y="362" font-size="12" font-weight="600" fill="#1f2328">1.72M  1%</text>
<text x="420" y="406" font-size="12" fill="#1f2328" text-anchor="end">memcpy/memset</text>
<rect x="430" y="386" width="4.7" height="30" fill="#8c959f" rx="2"/>
<text x="442.7" y="406" font-size="12" font-weight="600" fill="#1f2328">1.25M  1%</text>
<text x="420" y="450" font-size="12" fill="#1f2328" text-anchor="end">maps + hashing</text>
<rect x="430" y="430" width="3.8" height="30" fill="#8c959f" rx="2"/>
<text x="441.8" y="450" font-size="12" font-weight="600" fill="#1f2328">1.03M  1%</text>
<text x="420" y="494" font-size="12" fill="#1f2328" text-anchor="end">long tail (each &lt; 1.00M)</text>
<rect x="430" y="474" width="9.6" height="30" fill="#8c959f" rx="2"/>
<text x="447.6" y="494" font-size="12" font-weight="600" fill="#1f2328">2.56M  2%</text>
<rect x="430" y="527" width="11" height="11" fill="#cf222e" rx="2"/>
<text x="447" y="538" font-size="11" fill="#1f2328">freetype</text>
<rect x="560" y="527" width="11" height="11" fill="#0969da" rx="2"/>
<text x="577" y="538" font-size="11" fill="#1f2328">dvui</text>
<rect x="690" y="527" width="11" height="11" fill="#8c959f" rx="2"/>
<text x="707" y="538" font-size="11" fill="#1f2328">std, memory, allocator, other</text>
<text x="20" y="562" font-size="11" fill="#57606a">Each glyph the demo shows is hinted, outlined and rasterized once; after that the atlas is reused. Measured as the</text>
<text x="20" y="577" font-size="11" fill="#57606a">first two frames minus two steady frames; the least-squares intercept gives the same within 1.5%.</text>
</svg>
